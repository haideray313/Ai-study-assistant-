<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Forgot Password - Portal</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 35px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 360px; text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 10px; }
        p.sub { color: #7f8c8d; font-size: 13px; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; background-color: white; }
        button { width: 100%; background-color: #e67e22; color: white; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 15px; font-weight: bold; }
        button:hover { background-color: #d35400; }
        .error-box { background-color: #ffeaa7; color: #d63031; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 13px; font-weight: bold; border: 1px solid #d63031; }
        .links { margin-top: 20px; font-size: 14px; }
        .links a { color: #3498db; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
<div class="login-card">
    <h2>Reset Password</h2>
    <p class="sub">Enter your lowercase username and a new complex password.</p>

    <div th:if="${error}" class="error-box" th:text="${error}"></div>

    <form action="/reset-password" method="POST" autocomplete="off">
        <input type="text" style="display:none" aria-hidden="true">
        <input type="password" style="display:none" aria-hidden="true">

        <input type="text" id="resetUser" name="username" placeholder="Your Username (a-z)"
               pattern="^[a-z]{3,30}$" title="Lowercase letters only"
               autocomplete="off" readonly onfocus="this.removeAttribute('readonly');" required>

        <input type="password" id="resetPass" name="newPassword" placeholder="New Password (A-Z, a-z, 0-9, @#$)"
               autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly');" required>

        <input type="password" id="resetConfirm" name="confirmPassword" placeholder="Confirm New Password"
               autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly');" required>

        <button type="submit">Update Password</button>
    </form>

    <div class="links">
        <a href="/login">Back to Login</a>
    </div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('resetUser').value = '';
        document.getElementById('resetPass').value = '';
        document.getElementById('resetConfirm').value = '';
    });
</script>
</body>
</html>
