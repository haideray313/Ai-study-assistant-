<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Account - Portal</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 35px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 370px; text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; background-color: white; }
        button { width: 100%; background-color: #2ecc71; color: white; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 15px; font-weight: bold; }
        button:hover { background-color: #27ae60; }
        .error-box { background-color: #ffeaa7; color: #d63031; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 13px; font-weight: bold; border: 1px solid #d63031; }
        .rules { text-align: left; font-size: 12px; color: #636e72; margin: 10px 0; padding-left: 18px; line-height: 1.6; }
        .valid { color: #27ae60; font-weight: bold; }
        .invalid { color: #636e72; }
        .links { margin-top: 20px; font-size: 14px; }
        .links a { color: #3498db; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
<div class="login-card">
    <h2>Create Account</h2>

    <div th:if="${error}" class="error-box" th:text="${error}"></div>

    <form action="/register" method="POST" id="signupForm" autocomplete="off">
        <input type="text" style="display:none" aria-hidden="true">
        <input type="password" style="display:none" aria-hidden="true">

        <input type="text" id="username" name="username" placeholder="Username (lowercase letters only)"
               pattern="^[a-z]{3,30}$" title="Only lowercase letters (a-z), 3-30 characters"
               autocomplete="off" readonly onfocus="this.removeAttribute('readonly');" required>

        <input type="password" id="password" name="password" placeholder="Create Strong Password"
               autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly');" required>

        <ul class="rules">
            <li id="rule-user" class="invalid">Username: only lowercase alphabets (a-z, min 3)</li>
            <li id="rule-upper" class="invalid">At least 1 uppercase letter (A-Z)</li>
            <li id="rule-lower" class="invalid">At least 1 lowercase letter (a-z)</li>
            <li id="rule-num" class="invalid">At least 1 numeric digit (0-9)</li>
            <li id="rule-spec" class="invalid">At least 1 special character (@, #, $, %, !, etc.)</li>
            <li id="rule-len" class="invalid">Minimum 8 characters long</li>
        </ul>

        <button type="submit">Create Account</button>
    </form>

    <div class="links">
        <a href="/login">Back to Login</a>
    </div>
</div>

<script>
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');

    window.addEventListener('DOMContentLoaded', () => {
        usernameInput.value = '';
        passwordInput.value = '';
        setTimeout(() => {
            usernameInput.value = '';
            passwordInput.value = '';
            updateValidation();
        }, 100);
    });

    function updateValidation() {
        const u = usernameInput.value;
        const p = passwordInput.value;

        document.getElementById('rule-user').className = /^[a-z]{3,30}$/.test(u) ? 'valid' : 'invalid';
        document.getElementById('rule-upper').className = /[A-Z]/.test(p) ? 'valid' : 'invalid';
        document.getElementById('rule-lower').className = /[a-z]/.test(p) ? 'valid' : 'invalid';
        document.getElementById('rule-num').className = /\d/.test(p) ? 'valid' : 'invalid';
        document.getElementById('rule-spec').className = /[@$!%*?&#^()_+\-=\[\]{};':"\\|,.<>/?]/.test(p) ? 'valid' : 'invalid';
        document.getElementById('rule-len').className = p.length >= 8 ? 'valid' : 'invalid';
    }

    usernameInput.addEventListener('input', updateValidation);
    passwordInput.addEventListener('input', updateValidation);
</script>
</body>
</html>
