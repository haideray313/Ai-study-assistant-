<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Backend Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #f4f7f6; display: flex; height: 100vh; }
        .sidebar { width: 250px; background-color: #2c3e50; color: white; display: flex; flex-direction: column; padding-top: 20px; }
        .sidebar h2 { text-align: center; margin-bottom: 30px; }
        .sidebar a { color: #bdc3c7; text-decoration: none; padding: 15px 25px; display: block; font-weight: 500; }
        .sidebar a:hover, .sidebar a.active { background-color: #34495e; color: white; border-left: 4px solid #3498db; }
        .sidebar .logout { margin-top: auto; margin-bottom: 20px; background-color: #e74c3c; color: white; text-align: center; }
        .sidebar .logout:hover { background-color: #c0392b; border-left: none; }
        .main-content { flex-grow: 1; padding: 40px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="sidebar">
    <h2>PORTAL</h2>
    <a href="/home" class="active">Dashboard</a>
    <a href="/contact">Contact Support</a>
    <a href="/logout" class="logout">Log Out</a>
</div>
<div class="main-content">
    <h1>Welcome back, <span th:text="${username}" style="color: #3498db;">User</span>!</h1>

    <div class="card">
        <h3>System Status</h3>
        <p>Your database connection to Microsoft SQL Server is active.</p>
        <p>Authentication system is secured with BCrypt and strict regex validation.</p>
    </div>
</div>
</body>
</html>
